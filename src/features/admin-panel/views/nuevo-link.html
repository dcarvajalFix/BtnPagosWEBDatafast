<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Generar link de pago - Panel FixGroup</title>
    <link rel="stylesheet" href="/css/panel.css">
</head>

<body>
    <div id="nav"></div>
    <main>
        <div class="tarjeta angosta">
            <h1>Generar link de pago</h1>
            <form id="formLink">
                <div class="campo">
                    <label for="monto">Monto (USD)</label>
                    <input type="number" id="monto" min="0.01" step="0.01" max="5000" required>
                </div>
                <div class="campo">
                    <label for="descripcion">Descripción (opcional)</label>
                    <input type="text" id="descripcion" maxlength="255" placeholder="Ej: Membresía mensual - Juan Pérez">
                </div>
                
                <div class="campo">
                    <label for="caducidad">Caducidad del link</label>
                    <select id="caducidad">
                        <option value="">Predeterminada del sistema</option>
                        <option value="15">15 minutos</option>
                        <option value="30">30 minutos</option>
                        <option value="60">1 hora</option>
                        <option value="180">3 horas</option>
                        <option value="360">6 horas</option>
                        <option value="720">12 horas</option>
                        <option value="1440">24 horas</option>
                        <option value="4320">3 días</option>
                        <option value="10080">7 días</option>
                    </select>
                    <p class="ayuda">Pasado ese tiempo el cliente ya no podrá iniciar el pago con este link.</p>
                </div>

                <button type="submit" id="btnGenerar" class="primario" style="width:100%">Generar link</button>
            </form>

            <div id="resultado" class="link-generado oculto">
                <div id="textoExpira"></div>
                <input type="text" id="linkGenerado" readonly>
                <button type="button" id="btnCopiar" class="secundario">Copiar link</button>
                <a id="btnAbrir" class="secundario" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;padding:8px 12px;border:1px solid #ccc;border-radius:6px;color:#333;font-size:13px;margin-left:6px">Abrir</a>
            </div>
            <div id="mensaje" class="mensaje oculto"></div>
        </div>
    </main>
    <script src="/js/comun.js"></script>
    <script src="/js/nuevo-link.js"></script>
</body>

</html>
