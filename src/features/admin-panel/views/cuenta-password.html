<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mi contraseña - Panel FixGroup</title>
    <link rel="stylesheet" href="/css/panel.css">
</head>
<body>
    <div id="nav"></div>
    <main>
        <div class="tarjeta angosta">
            <h1>Cambiar mi contraseña</h1>
            <div id="avisoObligatorio" class="aviso-clave oculto">Por seguridad, debes definir una contraseña nueva antes de continuar.</div>
            <form id="formPassword" style="margin-top:14px">
                <div class="campo">
                    <label for="passwordActual">Contraseña actual</label>
                    <input type="password" id="passwordActual" required autocomplete="current-password">
                </div>
                <div class="campo">
                    <label for="passwordNueva">Contraseña nueva</label>
                    <input type="password" id="passwordNueva" required minlength="10" autocomplete="new-password">
                    <p class="ayuda">Mínimo 10 caracteres, con al menos una letra y un número.</p>
                </div>
                <div class="campo">
                    <label for="passwordRepetir">Repite la contraseña nueva</label>
                    <input type="password" id="passwordRepetir" required minlength="10" autocomplete="new-password">
                </div>
                <button type="submit" id="btnGuardar" class="primario" style="width:100%">Guardar contraseña</button>
            </form>
            <div id="mensaje" class="mensaje oculto"></div>
        </div>
    </main>
    <script src="/js/comun.js"></script>
    <script src="/js/cuenta-password.js"></script>
</body>
</html>
