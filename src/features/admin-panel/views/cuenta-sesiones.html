<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mis sesiones - Panel FixGroup</title>
    <link rel="stylesheet" href="/css/panel.css">
</head>
<body>
    <div id="nav"></div>
    <main>
        <div class="tarjeta">
            <h1>Mis sesiones</h1>
            <p class="ayuda">Aquí ves dónde está abierta tu cuenta. Si no reconoces alguna, ciérrala y cambia tu contraseña.</p>
            <div class="barra">
                <button type="button" id="btnCerrarOtras" class="peligro" disabled>Cerrar todas las demás</button>
            </div>
            <div id="mensaje" class="mensaje oculto"></div>
            <div id="cargando" class="cargando">Cargando...</div>
            <div class="tabla-scroll">
                <table id="tabla" class="oculto">
                    <thead>
                        <tr>
                            <th>Navegador</th>
                            <th>IP</th>
                            <th>Inició</th>
                            <th>Última actividad</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="/js/comun.js"></script>
    <script src="/js/cuenta-sesiones.js"></script>
</body>
</html>
