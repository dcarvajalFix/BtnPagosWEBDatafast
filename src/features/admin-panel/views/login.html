<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Iniciar sesión - FixGroup</title>
    <link rel="stylesheet" href="/css/panel.css">
</head>
<body>
    <div class="pagina-centrada">
        <div class="tarjeta angosta" style="width:100%">
            <h1 style="text-align:center">Panel FixGroup</h1>
            <form id="formLogin">
                <div class="campo">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username" autocapitalize="none">
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" id="btnLogin" class="primario" style="width:100%">Iniciar sesión</button>
            </form>
            <div id="mensaje" class="mensaje oculto"></div>
        </div>
    </div>
    <script src="/js/comun.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
